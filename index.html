<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Garage Climbing — Routes</title>
    <style>
      :root{
        --bg:#f6f8fb;--card:#fff;--muted:#6b7280;--accent:#2563eb
      }
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#eef2ff,var(--bg));color:#111;transition:background 0.35s ease}
      body.kids-theme{background:#b9e58b url('assets/kids-jungle.svg') center top/cover fixed no-repeat;color:#17351f}
      header{padding:2rem 1rem;text-align:center}
      h1{margin:0;font-size:1.75rem}
      .category-picker{min-height:55vh;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;align-items:center;max-width:760px;margin:2rem auto;padding:1rem}
      .category-button{min-height:220px;border:0;border-radius:18px;background-color:#fff;box-shadow:0 10px 28px rgba(16,24,40,0.12);font-size:clamp(2rem,6vw,4rem);font-weight:800;cursor:pointer;color:#fff;background-position:center;background-size:cover;position:relative;overflow:hidden;text-shadow:0 3px 12px rgba(0,0,0,0.8);isolation:isolate}
      .category-button span{position:relative;z-index:2}
      .category-button::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.24);z-index:1}
      .category-button:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(16,24,40,0.18)}
      .category-button.kids{background-image:url('assets/kids-jungle.svg')}
      .category-button.adults{background-image:url('assets/adult-climbing.svg')}
      .hidden{display:none!important}
      .back-button{margin:1rem auto 0;display:block;padding:0.5rem 0.8rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}
      .controls{display:flex;gap:0.75rem;justify-content:center;align-items:center;margin-top:0.75rem}
      select,input{padding:0.5rem 0.75rem;border-radius:8px;border:1px solid #e5e7eb}
      main{max-width:1100px;margin:1rem auto;padding:1rem}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
      .level-heading{grid-column:1 / -1;margin:1.5rem 0 0.25rem;padding:0.65rem 0.85rem;border-left:6px solid #f97316;background:#fff7ed;color:#9a3412;font-size:1.35rem}
      .grade-heading{border-left-color:#2563eb;background:#eff6ff;color:#1e3a8a}
      .level-heading:first-child{margin-top:0}
      .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(16,24,40,0.06);display:flex;flex-direction:column}
      .card img{width:100%;height:auto;object-fit:contain;display:block}
      .meta{padding:0.75rem 1rem}
      .name{font-weight:700;margin:0 0 0.25rem}
      .grade{color:var(--muted);font-size:0.9rem}
      .empty{padding:3rem;text-align:center;color:var(--muted)}
      /* Modal viewer (responsive) */
      .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:9999;padding:2rem}
      .modal.hidden{display:none}
      .modal-content{max-width:calc(100vw - 4rem);max-height:calc(100vh - 4rem);display:flex;align-items:center;justify-content:center;padding:0.5rem}
      .modal-content img{max-width:calc(100vw - 6rem);max-height:calc(100vh - 6rem);width:auto;height:auto;border-radius:8px;box-shadow:0 20px 40px rgba(2,6,23,0.6);object-fit:contain}
      .modal-close{position:fixed;top:1rem;left:1rem;background:#fff;border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 8px 20px rgba(2,6,23,0.2);cursor:pointer}
      @media (max-width:600px){
        .category-picker{grid-template-columns:1fr;min-height:auto;margin-top:1rem}
        .category-button{min-height:150px}
        .modal{padding:1rem}
        .modal-content img{max-width:calc(100vw - 3rem);max-height:calc(100vh - 3rem)}
        .modal-close{top:0.5rem;left:0.5rem;width:36px;height:36px;font-size:16px}
      }
      footer{padding:1rem;text-align:center;color:var(--muted);font-size:0.9rem}
    </style>
  </head>
  <body>
    <header>
      <h1>Garage Climbing — Routes</h1>
      <div id="categoryPicker" class="category-picker">
        <button class="category-button kids" data-category="kids" aria-label="Kids routes"><span>Kids</span></button>
        <button class="category-button adults" data-category="adults" aria-label="Adult routes"><span>Adults</span></button>
      </div>
      <button id="backToCategories" class="back-button hidden">Back to Kids / Adults</button>
      <div id="routeControls" class="controls hidden">
        <label for="gradeSelect">Grade:</label>
        <select id="gradeSelect"><option value="all">All</option></select>
        <label for="search">Name:</label>
        <input id="search" placeholder="Filter by name" />
      </div>
    </header>
    <main id="routeMain" class="hidden">
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" style="display:none">No climbs found.</div>
    </main>
    <!-- Modal viewer -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-close" id="modalClose" aria-label="Close">✕</div>
      <div class="modal-content">
          <div id="modalFrame" style="position:relative;display:inline-block">
            <img id="modalImg" alt="" src="" />
            <svg id="modalOverlay" style="position:absolute;left:0;top:0;pointer-events:none;z-index:5" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
    </div>
    <footer>Climbs shown are sourced from <a href="data/climbs.json">data/climbs.json</a>. Thumbnails use the canonical base image.</footer>

    <script>
      async function loadClimbs(){
        // load climbs from the repository data folder so only declared climbs appear
        try{
          const res = await fetch('data/climbs.json?t=' + Date.now());
          if(!res.ok) return [];
          const data = await res.json();
          // ensure each climb has an image path for the card — use base image
          return (data.climbs || []).map(c => Object.assign({ path: BASE_IMAGE }, c));
        }catch(e){
          return [];
        }
      }

      function uniqueGrades(climbs){
        const s = new Set(climbs.map(c=>c.grade));
        return Array.from(s).sort();
      }

      function climbCategory(climb){ return climb.category === 'kids' ? 'kids' : 'adults'; }

      function routeLabel(climb){
        if(climbCategory(climb) === 'kids') return `Level ${climb.kidsLevel || 1} · Climb ${climb.kidsNumber || 1}`;
        return climb.grade || 'Ungraded';
      }

      function gradeNumber(grade){
        const match = String(grade || '').match(/V\s*(\d+)/i);
        return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
      }

      function holdColour(value){
        const colour = String(value || '').trim().toLowerCase();
        const named = {
          blue:'#2563eb', red:'#dc2626', yellow:'#eab308', green:'#16a34a',
          orange:'#ea580c', purple:'#9333ea', pink:'#db2777', black:'#111827',
          white:'#f8fafc', grey:'#64748b', gray:'#64748b', wood:'#92400e'
        };
        return named[colour] || value || '#2563eb';
      }

      function appendStar(parent, cx, cy, outerRadius, innerRadius, attributes){
        const points = [];
        for(let i=0;i<10;i++){
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          points.push(`${cx + Math.cos(angle) * radius},${cy + Math.sin(angle) * radius}`);
        }
        const star = document.createElementNS('http://www.w3.org/2000/svg','polygon');
        star.setAttribute('points', points.join(' '));
        Object.entries(attributes).forEach(([key, value])=> star.setAttribute(key, value));
        parent.appendChild(star);
      }

      // show modal using canonical base image and overlay the selected climb
      const BASE_IMAGE = 'georef_image.jpg';
      function openModal(climbName){
        const modal = document.getElementById('modal');
        const img = document.getElementById('modalImg');
        img.src = BASE_IMAGE;
        img.alt = climbName || '';
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        // attempt to render route overlay for the named climb on the base image
        setTimeout(()=> renderOverlayForClimb(climbName, img), 50);
      }

        async function renderOverlayForClimb(climbName, imgEl){
          const overlay = document.getElementById('modalOverlay');
          if(!overlay) return;
          // clear
          while(overlay.firstChild) overlay.removeChild(overlay.firstChild);
          // try load data files from repo 'data' folder (cache-bust to pick up edits)
          let holdsData = null; let climbsData = null;
          try{ holdsData = await fetch('data/holds.json?t=' + Date.now()).then(r=> r.ok ? r.json() : null); }catch(e){}
          try{ climbsData = await fetch('data/climbs.json?t=' + Date.now()).then(r=> r.ok ? r.json() : null); }catch(e){}
          if(!holdsData || !climbsData) return;
          const climb = (climbsData.climbs||[]).find(c=> c.name === climbName || c.id === climbName);
          if(!climb) return;
          const holdsMap = new Map(); (holdsData.holds||[]).forEach(h=> holdsMap.set(h.id, h));
          // wait for image to layout
          await new Promise(res=>{ if(imgEl.complete) res(); else imgEl.onload = ()=> res(); });
          const rect = imgEl.getBoundingClientRect();
          const w = imgEl.naturalWidth && imgEl.naturalHeight ? rect.width : rect.width;
          const h = rect.height;
          overlay.setAttribute('width', rect.width); overlay.setAttribute('height', rect.height);
          overlay.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
          overlay.setAttribute('preserveAspectRatio', 'none');
          overlay.style.width = rect.width + 'px'; overlay.style.height = rect.height + 'px'; overlay.style.left = '0px'; overlay.style.top = '0px';
            // draw markers only (no connecting line) — large view: unfilled stroked circles so image shows through
            const markerPoints = [];
            for(const [holdIndex, hid] of (climb.holds||[]).entries()){
              // try find by id first, then by hold name
              let ho = holdsMap.get(hid);
              if(!ho){ ho = (holdsData.holds||[]).find(h=> h.name === hid || h.id === hid); }
              if(!ho) continue;
              const cx = ho.x * rect.width; const cy = ho.y * rect.height;
              markerPoints.push([cx, cy]);
              if(holdIndex === (climb.holds || []).length - 1){
                appendStar(overlay, cx, cy, 13, 6, { fill: 'none', stroke: holdColour(ho.colour), 'stroke-width': 3 });
              } else {
                const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', 8);
                circle.setAttribute('fill', 'none');
                circle.setAttribute('stroke', holdColour(ho.colour));
                circle.setAttribute('stroke-width', 3);
                overlay.appendChild(circle);
              }
              // add label (name or id) next to marker, with light outline for contrast
              const labelText = (ho.name && ho.name.trim()) ? ho.name : hid;
              const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
              txt.setAttribute('x', cx + 12);
              txt.setAttribute('y', cy + 4);
              txt.setAttribute('fill', '#111');
              txt.setAttribute('font-size', Math.max(12, Math.round(rect.width / 80)));
              txt.setAttribute('stroke', '#fff');
              txt.setAttribute('stroke-width', 2);
              txt.setAttribute('paint-order', 'stroke');
              txt.setAttribute('dominant-baseline', 'middle');
              txt.textContent = labelText;
              overlay.appendChild(txt);
            }
            // place notes box in the area with maximum minimum distance from markers
            const notes = (climb.notes || '').trim();
            if(notes){
              const boxW = Math.min(Math.max(160, rect.width * 0.3), 380);
              const boxH = Math.min(Math.max(40, rect.height * 0.12), 160);
              const padding = 10;
              const candidates = [
                {x: padding, y: padding},
                {x: rect.width - boxW - padding, y: padding},
                {x: padding, y: rect.height - boxH - padding},
                {x: rect.width - boxW - padding, y: rect.height - boxH - padding},
                {x: (rect.width - boxW) / 2, y: padding},
                {x: (rect.width - boxW) / 2, y: rect.height - boxH - padding}
              ];
              function rectPointDist(rx, ry, rw, rh, px, py){
                const dx = Math.max(rx - px, 0, px - (rx + rw));
                const dy = Math.max(ry - py, 0, py - (ry + rh));
                return Math.hypot(dx, dy);
              }
              let best = candidates[0]; let bestScore = -1;
              for(const c of candidates){
                let minD = Infinity;
                for(const p of markerPoints){ minD = Math.min(minD, rectPointDist(c.x, c.y, boxW, boxH, p[0], p[1])); }
                if(minD > bestScore){ bestScore = minD; best = c; }
              }
              // draw a subtle rounded rect and text using SVG
              const rectEl = document.createElementNS('http://www.w3.org/2000/svg','rect');
              rectEl.setAttribute('x', best.x); rectEl.setAttribute('y', best.y);
              rectEl.setAttribute('width', boxW); rectEl.setAttribute('height', boxH);
              rectEl.setAttribute('rx', 8); rectEl.setAttribute('ry', 8);
              rectEl.setAttribute('fill', 'white'); rectEl.setAttribute('fill-opacity', 0.85);
              rectEl.setAttribute('stroke', '#ddd'); rectEl.setAttribute('stroke-width', 1);
              overlay.appendChild(rectEl);
              const lines = String(notes).split('\n');
              const fontSize = Math.max(12, Math.min(16, Math.round(boxH / (lines.length + 1))));
              for(let i=0;i<lines.length;i++){
                const t = document.createElementNS('http://www.w3.org/2000/svg','text');
                t.setAttribute('x', best.x + 12); t.setAttribute('y', best.y + 12 + (i * (fontSize + 2)) + fontSize);
                t.setAttribute('fill', '#111'); t.setAttribute('font-size', fontSize);
                t.textContent = lines[i];
                overlay.appendChild(t);
              }
            }
        }

      function closeModal(){
        const modal = document.getElementById('modal');
        const img = document.getElementById('modalImg');
        modal.classList.add('hidden');
        img.src = '';
        document.body.style.overflow = '';
      }

      // close when clicking background or close button
      document.addEventListener('click', (e)=>{
        const modal = document.getElementById('modal');
        if(!modal) return;
        if(e.target.id === 'modal' || e.target.id === 'modalClose') closeModal();
      });

      // close on ESC
      document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

      function render(climbs, filterGrade, search){
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        grid.innerHTML='';
        const filtered = climbs.filter(c=>{
          if(filterGrade && filterGrade!=='all' && c.grade!==filterGrade) return false;
          if(search){
            return c.name.toLowerCase().includes(search.toLowerCase());
          }
          return true;
        });
        if(filtered.length===0){ empty.style.display='block'; return }
        empty.style.display='none';
        let lastGroup = null;
        for(const c of filtered){
          const group = climbCategory(c) === 'kids' ? `level-${Number(c.kidsLevel) || 1}` : `grade-${c.grade || 'Ungraded'}`;
          if(group !== lastGroup){
            const heading = document.createElement('h2');
            heading.className = climbCategory(c) === 'kids' ? 'level-heading' : 'level-heading grade-heading';
            heading.textContent = climbCategory(c) === 'kids' ? `Level ${Number(c.kidsLevel) || 1}` : (c.grade || 'Ungraded');
            grid.appendChild(heading);
            lastGroup = group;
          }
          // build card with image + SVG overlay for thumbnail markers
          const el = document.createElement('article'); el.className='card';
          const frame = document.createElement('div'); frame.style.position = 'relative'; frame.style.width = '100%';
          const img = document.createElement('img'); img.src = c.path; img.alt = c.name; img.style.cursor = 'pointer'; img.style.display = 'block';
          const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
          svg.style.position = 'absolute'; svg.style.left = 0; svg.style.top = 0; svg.style.pointerEvents = 'none'; svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
          // when image loads, set svg size and draw markers
          img.addEventListener('load', async ()=>{
            const rect = img.getBoundingClientRect();
            svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
            svg.style.width = rect.width + 'px'; svg.style.height = rect.height + 'px';
            // clear existing
            while(svg.firstChild) svg.removeChild(svg.firstChild);
            // draw vibrant filled markers for thumbnail
            try{
              const holdsData = window.__holdsData || await fetch('data/holds.json?t=' + Date.now()).then(r=> r.ok ? r.json() : null);
              if(holdsData && holdsData.holds){
                const holdsMap = new Map(); holdsData.holds.forEach(h=> holdsMap.set(h.id, h));
                for(const [holdIndex, hid] of (c.holds||[]).entries()){
                  let ho = holdsMap.get(hid);
                  if(!ho) ho = holdsData.holds.find(h=> h.name === hid || h.id === hid);
                  if(!ho) continue;
                  const cx = ho.x * rect.width; const cy = ho.y * rect.height;
                  if(holdIndex === (c.holds || []).length - 1){
                    appendStar(svg, cx, cy, 10, 4.5, { fill: holdColour(ho.colour), stroke: '#fff', 'stroke-width': 1.5 });
                  } else {
                    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
                    circ.setAttribute('cx', cx); circ.setAttribute('cy', cy); circ.setAttribute('r', 6);
                    circ.setAttribute('fill', holdColour(ho.colour)); circ.setAttribute('stroke', '#fff'); circ.setAttribute('stroke-width', 1.5);
                    svg.appendChild(circ);
                  }
                }
              }
            }catch(e){/* ignore */}
          });
          img.addEventListener('click', ()=> openModal(c.name));
          const meta = document.createElement('div'); meta.className='meta';
          const name = document.createElement('div'); name.className='name'; name.textContent = c.name;
          const grade = document.createElement('div'); grade.className='grade'; grade.textContent = routeLabel(c);
          meta.appendChild(name); meta.appendChild(grade);
          frame.appendChild(img); frame.appendChild(svg);
          el.appendChild(frame); el.appendChild(meta);
          grid.appendChild(el);
        }
      }

      (async function(){
        const climbs = await loadClimbs();
        // preload holds data for thumbnail rendering
        try{ window.__holdsData = await fetch('data/holds.json?t=' + Date.now()).then(r=> r.ok ? r.json() : null); }catch(e){ window.__holdsData = null }
        const categoryPicker = document.getElementById('categoryPicker');
        const routeMain = document.getElementById('routeMain');
        const routeControls = document.getElementById('routeControls');
        const backButton = document.getElementById('backToCategories');
        const gradeSelect = document.getElementById('gradeSelect');
        const searchInput = document.getElementById('search');
        let selectedCategory = null;
        function update(){
          const categoryClimbs = climbs
            .filter(c=>climbCategory(c) === selectedCategory)
            .sort((a,b)=> selectedCategory === 'kids'
              ? ((Number(a.kidsLevel)||1) - (Number(b.kidsLevel)||1)) || ((Number(a.kidsNumber)||1) - (Number(b.kidsNumber)||1))
              : (gradeNumber(a.grade) - gradeNumber(b.grade)) || String(a.name).localeCompare(String(b.name)));
          render(categoryClimbs, gradeSelect.value, searchInput.value.trim());
        }
        function selectCategory(category){
          selectedCategory = category;
          document.body.classList.toggle('kids-theme', category === 'kids');
          categoryPicker.classList.add('hidden');
          backButton.classList.remove('hidden');
          routeMain.classList.remove('hidden');
          routeControls.classList.toggle('hidden', category !== 'adults');
          gradeSelect.innerHTML = '<option value="all">All adult grades</option>';
          if(category === 'adults'){
            for(const g of uniqueGrades(climbs.filter(c=>climbCategory(c)==='adults'))){
              const opt = document.createElement('option'); opt.value=g; opt.textContent=g; gradeSelect.appendChild(opt);
            }
          }
          searchInput.value = '';
          update();
        }
        categoryPicker.querySelectorAll('[data-category]').forEach(button=> button.addEventListener('click', ()=> selectCategory(button.dataset.category)));
        backButton.addEventListener('click', ()=>{
          selectedCategory = null;
          document.body.classList.remove('kids-theme');
          categoryPicker.classList.remove('hidden');
          backButton.classList.add('hidden');
          routeMain.classList.add('hidden');
          routeControls.classList.add('hidden');
        });
        gradeSelect.addEventListener('change', update);
        searchInput.addEventListener('input', update);
        update();
      })();
    </script>
  </body>
</html>
